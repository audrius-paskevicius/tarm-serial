name: Go
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: go test -race -timeout 60s ./...
      - run: go test -tags=serialdiagnostic -timeout 60s ./...
      - run: go vet ./...
      - name: Unix pseudo-terminal timeout and close
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pty, subprocess
          master, slave = pty.openpty()
          try:
              environment = dict(os.environ, SERIAL_TEST_PORT=os.ttyname(slave))
              subprocess.run(['go', 'test', '-race', '-run', 'TestHardwareIdleClose',
                              '-v', '-timeout', '30s'], env=environment, check=True, timeout=60)
          finally:
              os.close(slave)
              os.close(master)
          PY
